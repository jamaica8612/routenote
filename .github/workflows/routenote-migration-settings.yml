name: RouteNote one-time server settings migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routenote-migration-settings
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy RouteNote external secrets and add its redirects
        env:
          ROUTENOTE_MIGRATION_TOKEN: ${{ secrets.ROUTENOTE_MIGRATION_TOKEN }}
        run: python3 scripts/migrate-routenote-settings.py
