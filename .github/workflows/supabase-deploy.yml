name: RouteNote Functions Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/routenote-*/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'

permissions:
  contents: read

concurrency:
  group: routenote-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Schema/data/auth migration is a separate reviewed operation.
      # Never replay schema.sql, legacy rn_* migrations, or seeds here.
      - name: Deploy RouteNote functions only
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          supabase functions deploy routenote-geocode --project-ref xrrdokcjhjqdfvwtbenl
          supabase functions deploy routenote-postcode-zone --project-ref xrrdokcjhjqdfvwtbenl
          supabase functions deploy routenote-zone-at-point --project-ref xrrdokcjhjqdfvwtbenl
          supabase functions deploy routenote-road-geometry --project-ref xrrdokcjhjqdfvwtbenl
          supabase functions deploy routenote-send-push --project-ref xrrdokcjhjqdfvwtbenl
