name: RouteNote Android setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routenote-android-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Add RouteNote redirects while preserving existing auth settings
        run: python3 scripts/setup-android-backend.py
