name: RouteNote Android setup

on:
  workflow_dispatch:
    inputs:
      migrate_server_settings:
        description: Copy RouteNote external secrets before adding redirects
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: routenote-android-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Add RouteNote redirects while preserving existing auth settings
        if: ${{ !inputs.migrate_server_settings }}
        run: python3 scripts/setup-android-backend.py
      - name: Migrate RouteNote server settings
        if: ${{ inputs.migrate_server_settings }}
        env:
          ROUTENOTE_MIGRATION_TOKEN: ${{ secrets.ROUTENOTE_MIGRATION_TOKEN }}
        run: python3 scripts/migrate-routenote-settings.py
